<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMU live</title>
<style>
:root { --bg: #fff; --fg: #1a1a2e; --muted: #6b7080; --line: #e3e6ea; --blue: #0079c3; --red: #c0392b;
        --x: #c0392b; --y: #1e8e3e; --z: #0079c3; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 18px/1.3 "Noto Sans", "DejaVu Sans", "Segoe UI", Arial, sans-serif; }
header { height: 56px; background: var(--blue); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 24px; }
header h1 { font-size: 24px; margin: 0; font-weight: 600; }
header .status { opacity: .85; font-size: 16px; }
header .spacer { flex: 1; }
header .keys { font-size: 14px; opacity: .8; }
main { height: calc(100% - 56px); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; padding: 12px; }
.panel { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; }
.panel h2 { font-size: 20px; margin: 8px 14px 0; }
.panel .sub { font-size: 14px; color: var(--muted); margin: 0 14px; }
.panel canvas { flex: 1; width: 100%; min-height: 0; }
#posPanel { grid-row: 1 / 3; grid-column: 2; }
.legend span { font-weight: 700; margin-right: 10px; }
#drift { font-size: 28px; font-weight: 700; color: var(--red); margin: 4px 14px 10px; }
</style>
</head>
<body>
<header>
  <h1>IMU live</h1>
  <span class="status" id="status">warte auf Handy …</span>
  <span class="spacer"></span>
  <span class="keys">R = Position zurücksetzen · Leertaste = Pause</span>
</header>
<main>
  <section class="panel">
    <h2>Beschleunigung</h2>
    <p class="sub legend">m/s² · <span style="color:var(--x)">x</span><span style="color:var(--y)">y</span><span style="color:var(--z)">z</span> (inkl. Schwerkraft)</p>
    <canvas id="acc"></canvas>
  </section>
  <section class="panel">
    <h2>Drehrate (Gyroskop)</h2>
    <p class="sub legend">rad/s · <span style="color:var(--x)">x</span><span style="color:var(--y)">y</span><span style="color:var(--z)">z</span></p>
    <canvas id="gyr"></canvas>
  </section>
  <section class="panel" id="posPanel">
    <h2>Position aus Doppelintegration</h2>
    <p class="sub">Beschleunigung ohne Schwerkraft, zweimal aufsummiert · Draufsicht x/y</p>
    <canvas id="pos"></canvas>
    <div id="drift">–</div>
  </section>
</main>
<script>
const WINDOW_S = 10;                       // Zeitfenster der Verlaufskurven
const hist = { acc: [], gyr: [] };         // [t, x, y, z]
let p = [0, 0, 0], v = [0, 0, 0], tLast = null, t0 = null, trail = [], paused = false;
let gravity = null, live = false;                        // Tiefpass-Schätzung, falls kein Linear-Sensor kommt

const now = () => performance.now() / 1000;

function classify(name) {
  const n = name.toLowerCase();
  if (n.includes("uncalibrated")) return null;
  if (n.includes("linear")) return "lin";
  if (n.includes("accel")) return "acc";
  if (n.includes("gyro")) return "gyr";
  return null;
}

function onSample(obj) {
  if (obj._status) { live = false; document.getElementById("status").textContent = obj._status; return; }
  if (paused) return;
  if (!live) { live = true; document.getElementById("status").textContent = "live"; }
  const t = now();
  let lin = null;
  for (const [name, s] of Object.entries(obj)) {
    const kind = classify(name);
    const val = s && s.values;
    if (!kind || !Array.isArray(val) || val.length < 3) continue;
    if (kind === "lin") lin = val.slice(0, 3);
    else hist[kind].push([t, ...val.slice(0, 3)]);
    if (kind === "acc") {
      gravity = gravity ? gravity.map((g, i) => 0.95 * g + 0.05 * val[i]) : val.slice(0, 3);
      if (!lin) lin = val.slice(0, 3).map((a, i) => a - gravity[i]);
    }
  }
  for (const k in hist) while (hist[k].length && hist[k][0][0] < t - WINDOW_S) hist[k].shift();
  if (lin) integrate(lin, t);
}

function integrate(a, t) {
  if (tLast === null) { tLast = t; t0 = t; return; }
  const dt = Math.min(t - tLast, 0.2); tLast = t;
  for (let i = 0; i < 3; i++) { v[i] += a[i] * dt; p[i] += v[i] * dt; }
  trail.push([p[0], p[1]]);
  if (trail.length > 5000) trail.shift();
}

function reset() { p = [0, 0, 0]; v = [0, 0, 0]; tLast = null; t0 = null; trail = []; }

function fit(c) {
  const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * d) || c.height !== Math.round(r.height * d)) {
    c.width = Math.round(r.width * d); c.height = Math.round(r.height * d);
  }
  const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0);
  return [g, r.width, r.height];
}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function drawSeries(id, data, range) {
  const [g, w, h] = fit(document.getElementById(id));
  g.clearRect(0, 0, w, h);
  const pad = 40, y0 = h / 2, sy = (h / 2 - 12) / range, t1 = now();
  g.strokeStyle = css("--line"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(pad, y0); g.lineTo(w - 8, y0); g.stroke();
  g.fillStyle = css("--muted"); g.font = "13px sans-serif";
  g.fillText("+" + range, 4, 18); g.fillText("−" + range, 4, h - 6); g.fillText("0", 4, y0 + 4);
  ["--x", "--y", "--z"].forEach((col, i) => {
    g.strokeStyle = css(col); g.lineWidth = 2.5; g.beginPath();
    data.forEach(([t, ...vals], j) => {
      const x = pad + (w - pad - 8) * (1 - (t1 - t) / WINDOW_S);
      const y = y0 - Math.max(-range, Math.min(range, vals[i])) * sy;
      j ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.stroke();
  });
}

function drawPos() {
  const [g, w, h] = fit(document.getElementById("pos"));
  g.clearRect(0, 0, w, h);
  const far = trail.reduce((m, [x, y]) => Math.max(m, Math.abs(x), Math.abs(y)), 0.25);
  const s = (Math.min(w, h) / 2 - 30) / (far * 1.1), cx = w / 2, cy = h / 2;
  g.strokeStyle = css("--line"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(cx, 10); g.lineTo(cx, h - 10); g.moveTo(10, cy); g.lineTo(w - 10, cy); g.stroke();
  g.fillStyle = css("--muted"); g.font = "14px sans-serif";
  g.fillText("Maßstab: " + (far * 1.1).toFixed(2).replace(".", ",") + " m bis zum Rand", 12, h - 12);
  g.strokeStyle = css("--red"); g.lineWidth = 3; g.beginPath();
  trail.forEach(([x, y], j) => j ? g.lineTo(cx + x * s, cy - y * s) : g.moveTo(cx + x * s, cy - y * s));
  g.stroke();
  g.fillStyle = css("--blue"); g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill();
  if (trail.length) {
    const [x, y] = trail[trail.length - 1];
    g.fillStyle = css("--red"); g.beginPath(); g.arc(cx + x * s, cy - y * s, 8, 0, 7); g.fill();
  }
  const d = Math.hypot(p[0], p[1], p[2]), secs = t0 === null ? 0 : (tLast - t0);
  document.getElementById("drift").textContent =
    `Abweichung vom Start: ${d.toFixed(2).replace(".", ",")} m nach ${secs.toFixed(0)} s`;
}

function frame() {
  drawSeries("acc", hist.acc, 20);
  drawSeries("gyr", hist.gyr, 6);
  drawPos();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") reset();
  if (e.key === " ") { paused = !paused; e.preventDefault(); }
});

if (location.search.includes("test")) {
  // Nur zum Testen ohne Handy: künstliche Werte mit kleinem Messfehler
  live = true; document.getElementById("status").textContent = "TESTDATEN";
  setInterval(() => {
    const t = now(), n = () => (Math.random() - 0.5) * 0.3;
    onSample({ "Test Accelerometer": { values: [Math.sin(t * 2) * 3 + n(), Math.cos(t) * 2 + n(), 9.81 + n()] },
               "Test Gyroscope": { values: [Math.sin(t * 3) + n(), n(), Math.cos(t * 2) * 0.5 + n()] },
               "Test Linear Acceleration": { values: [0.05 + n(), 0.02 + n(), n()] } });
  }, 20);
} else {
  const es = new EventSource("/events");
  es.onmessage = e => { try { onSample(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => { live = false; document.getElementById("status").textContent = "Server nicht erreichbar"; };
}
</script>
</body>
</html>
